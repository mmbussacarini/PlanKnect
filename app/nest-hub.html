<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Abertura: aparece na hora (antes do CSS do app) e some quando o app está pronto */
  html, body { margin: 0; background: #040817; }
  body:not(.pk-ready) > :not(#pk-splash):not(script) { visibility: hidden; }
  #pk-splash { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(60vmin 60vmin at 50% 45%, #0f1f5c 0%, #040817 70%); transition: opacity .5s ease; font-family: "Google Sans", Roboto, Arial, sans-serif; }
  #pk-splash img { width: 18vmin; height: 18vmin; animation: pk-pop 1.6s ease-in-out infinite alternate; filter: drop-shadow(0 1.5vmin 4vmin rgba(31, 123, 255, .55)); }
  #pk-splash b { margin-top: 3.5vmin; font-size: 5.5vmin; font-weight: 800; letter-spacing: -.1vmin; background: linear-gradient(90deg, #8b7bff, #c4a7ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #pk-splash i { margin-top: 3vmin; width: 22vmin; height: .6vmin; border-radius: 1vmin; background: rgba(255, 255, 255, .1); overflow: hidden; position: relative; }
  #pk-splash i:after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 1vmin; background: linear-gradient(90deg, #3b82f6, #a78bfa); animation: pk-bar 1.2s ease-in-out infinite; }
  body.pk-ready #pk-splash { opacity: 0; pointer-events: none; }
  @keyframes pk-pop { from { transform: scale(.94); } to { transform: scale(1.04); } }
  @keyframes pk-bar { from { left: -40%; } to { left: 100%; } }
</style>
<title>PlanKnect nest-hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<script>window.PK_CSS = ["css/nest-hub.css", "css/jarvis.css"];</script>
</head>
<body>
<div id="pk-splash"><img src="assets/logo.svg" width="100" height="100" alt=""><b>PlanKnect</b><i></i></div>
<div id="hub">
  <div id="hub-bg" class="scene-host"></div>

  <!-- Pareamento -->
  <section id="hub-pair" class="hub-screen">
    <div class="hp-left">
      <div class="hp-brand"><img src="assets/logo.svg" width="40" height="40" alt=""><span class="wordmark">PlanKnect</span><small>nest-hub</small></div>
      <h1>Conecte este display à família</h1>
      <p>Aponte a câmera do celular para o QR, ou abra <b id="hp-url">planknect.com/tv</b> e digite:</p>
      <div id="hp-code" class="hp-code">····-····</div>
      <div id="hp-status" class="hp-status"></div>
      <div class="hp-btns"><button data-act="demo">Modo demonstração</button><button data-act="retry">Novo código</button></div>
    </div>
    <div class="hp-qr"><div id="hp-qrbox"></div></div>
  </section>

  <!-- Principal -->
  <section id="hub-main" class="hub-screen">
    <header class="hb-top">
      <div class="hb-brand"><img src="assets/logo.svg" width="40" height="40" alt=""><span id="hb-date"></span></div>
      <div class="hb-right"><button id="hb-sync" class="hb-sync" data-act="sync"></button><button class="hb-kn" data-act="knect"><span class="kn-mini"><i></i></span></button><button class="hb-mic" data-act="mic"><i data-ic="mic"></i></button><span id="hb-wx"></span><b id="hb-clock"></b><button class="hb-gear" data-act="settings"><i data-ic="gear"></i></button></div>
    </header>
    <main id="hb-view"></main>
    <nav class="hb-nav">
      <button data-tab="today" class="on"><i data-ic="calendar"></i>Hoje</button>
      <button data-tab="list"><i data-ic="cart"></i>Lista</button>
      <button data-tab="chores"><i data-ic="star"></i>Missões</button>
      <button data-tab="tasks"><i data-ic="task"></i>Tarefas</button>
      <button data-tab="dinner"><i data-ic="chef"></i>Jantar</button>
      <button data-tab="timers"><i data-ic="refresh"></i>Timers<span id="hb-tbadge"></span></button>
      <button data-tab="weather"><i data-ic="partly"></i>Clima</button>
      <button data-tab="notes"><i data-ic="note"></i>Recados</button>
      <button data-act="frame"><i data-ic="sparkle"></i>Moldura</button>
    </nav>
  </section>

  <!-- Modo ambiente (fotos/relógio) -->
  <div id="hub-ambient"></div>
  <!-- Receita passo a passo -->
  <div id="hub-recipe"></div>
  <!-- Campainha -->
  <div id="hub-door"></div>
  <!-- Recado/aviso -->
  <div id="hub-banner"></div>
  <!-- Alarme de timer -->
  <div id="hub-alarm"></div>
  <div id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>window.PK_JS = ["js/config.js", "js/core.js", "js/api.js", "js/assistant.js", "js/scenes.js", "js/saver.js", "js/jarvis.js", "js/hub.js"];</script>
<script>
/* Carrega CSS/JS com a versão atual (version.json) para nunca ficar preso em cache. */
(function () {
  var v = String(Date.now());
  try { var x = new XMLHttpRequest(); x.open('GET', 'version.json?t=' + Date.now(), false); x.send(); v = JSON.parse(x.responseText).version || v; } catch (e) {}
  window.PK_VERSION = v;
  (window.PK_CSS || []).forEach(function (h) { document.write('<link rel="stylesheet" href="' + h + '?v=' + v + '">'); });
  (window.PK_JS || []).forEach(function (s) { document.write('<script src="' + s + '?v=' + v + '"><\/script>'); });
})();
</script>
</body>
</html>
